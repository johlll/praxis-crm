name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # O CI nunca depende do projeto Supabase de produção nem do
    # praxis-crm-dev hospedado: sobe um Postgres local do zero, via Docker
    # (o runner do GitHub já tem), aplica as migrations desta branch nele e
    # roda os testes de banco ali — é este job, não a máquina de
    # desenvolvimento, quem valida migrations e RLS de verdade.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm ci` instala exatamente o que está no lockfile.
      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Testes unitários
        run: npm test
        continue-on-error: true

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Subir Supabase local
        run: supabase start

      - name: Aplicar migrations do zero (local)
        run: supabase db reset --local

      - name: Gerar tipos e comparar com o que está commitado
        run: npm run db:types:check
        continue-on-error: true

      - name: Testes de banco — RLS, convites, último owner, hardening (pgTAP)
        run: npm run test:db
        continue-on-error: true

      - name: Testes de isolamento entre workspaces
        run: npm run test:isolation
        continue-on-error: true

      - name: Teste de concorrência real (A7 — mensagens simultâneas)
        # pgTAP roda numa única conexão por arquivo — não prova concorrência
        # de verdade. Aqui, duas chamadas HTTP concorrentes via
        # @supabase/supabase-js contra o Supabase local (schema+seed já
        # aplicados pelos passos acima) são duas transações Postgres
        # genuinamente simultâneas — ver scripts/a7-concurrency-check.mjs.
        run: |
          RAW="$(supabase status -o env)"
          eval "$RAW"
          NEXT_PUBLIC_SUPABASE_URL="${API_URL:?API_URL vazio}" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:?PUBLISHABLE_KEY vazio}" \
            node scripts/a7-concurrency-check.mjs

      - name: Teste de concorrência real (numeração de propostas)
        # Mesmo motivo do passo acima: criações simultâneas de proposta em
        # clientes independentes — ver scripts/a9-proposal-number-concurrency-check.mjs.
        run: |
          RAW="$(supabase status -o env)"
          eval "$RAW"
          NEXT_PUBLIC_SUPABASE_URL="${API_URL:?API_URL vazio}" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:?PUBLISHABLE_KEY vazio}" \
            node scripts/a9-proposal-number-concurrency-check.mjs

      - name: Teste de concorrência real (A11 — convergência de outbox órfã)
        # Mesmo motivo dos dois passos acima: duas chamadas concorrentes de
        # resolve_stale_outbox_batch sobre a MESMA outbox órfã não podem
        # convergê-la duas vezes — ver
        # scripts/a11-outbox-resolve-concurrency-check.mjs. Função exclusiva
        # do service_role, por isso usa a chave de service role local
        # (Postgres descartado ao fim do workflow).
        run: |
          RAW="$(supabase status -o env)"
          eval "$RAW"
          NEXT_PUBLIC_SUPABASE_URL="${API_URL:?API_URL vazio}" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:?PUBLISHABLE_KEY vazio}" \
          SUPABASE_SECRET_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:?SERVICE_ROLE_KEY/SECRET_KEY vazio}}" \
            node scripts/a11-outbox-resolve-concurrency-check.mjs

      - name: Exportar credenciais do Supabase local para o build/e2e
        run: |
          # Escreve .env.local de verdade em vez de só exportar em
          # $GITHUB_ENV: o webServer que o Playwright sobe (npm run start,
          # dentro de mais uma camada de subprocesso) voltou a reclamar de
          # NEXT_PUBLIC_SUPABASE_URL ausente mesmo com a variável presente
          # no ambiente do próprio step — Next.js lê .env.local direto do
          # checkout tanto em build quanto em start, sem depender de
          # quantas camadas de processo filho o valor precisou atravessar.
          RAW="$(supabase status -o env)"
          echo "Nomes de variável que 'supabase status -o env' emite:"
          echo "$RAW" | cut -d= -f1
          eval "$RAW"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:?API_URL vazio — nome da variável mudou, ver lista acima}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:?PUBLISHABLE_KEY vazio — nome da variável mudou, ver lista acima}"
            # Segredo só para este job efêmero (Postgres local descartado
            # ao fim do workflow) — nunca o do projeto hospedado de verdade.
            echo "WORKSPACE_ACTIVE_COOKIE_SECRET=$(openssl rand -base64 32)"
            # CONTACTS_*: chave de teste FIXA (não gerada por openssl como a
            # de cima) — precisa ser a MESMA que cifrou os CPFs de
            # supabase/seed.sql (o local que `supabase db reset` acabou de
            # aplicar), senão o app não decifraria os dados do seed.
            # Documentada como chave de teste em docs/decisoes/a3-criptografia.md
            # — nunca usada em nenhum ambiente real.
            echo "CONTACTS_ACTIVE_KEY_VERSION=1"
            echo 'CONTACTS_KEY_VERSIONS={"1":{"cipher":"EJn8xOi/LndtKMmLXhYJcdpHsV6uOlYLeyxVMDH+Gpo=","hmac":"DpvUCkbNyVHMdcdTwxa865Ho2zlg4tccndsxuVAhv2U="}}'
            # A11 — ingestão pública. Nada aqui é segredo: Turnstile,
            # Upstash e Inngest são substituídos por adaptadores de
            # teste (A11_INGEST_MODE=test-adapters), que o código
            # RECUSA em produção e preview por construção. As chaves de
            # cifra e de HMAC são fictícias, deste job efêmero.
            echo "SUPABASE_SECRET_KEY=${SERVICE_ROLE_KEY:-${SECRET_KEY:-sem-service-role}}"
            echo "A11_INGEST_MODE=test-adapters"
            echo "A11_PAYLOAD_ACTIVE_KEY_VERSION=1"
            echo 'A11_PAYLOAD_KEY_VERSIONS={"1":{"cipher":"cHJheGlzLWExMS1wYXlsb2FkLWtleS1kZS10ZXN0ZSE="}}'
            echo "A11_IP_HMAC_KEY=cHJheGlzLWExMS1pcC1obWFjLWtleS1kZS10ZXN0ZSE="
            echo "TURNSTILE_SECRET_KEY=turnstile-de-teste"
            echo "UPSTASH_REDIS_REST_URL=https://upstash.invalido.test"
            echo "UPSTASH_REDIS_REST_TOKEN=token-de-teste"
            echo "INNGEST_EVENT_KEY=evento-de-teste"
            echo "INNGEST_SIGNING_KEY=assinatura-de-teste"
            echo "CRON_SECRET=cron-secret-do-job-efemero-0001"
          } > .env.local
          echo "Conferindo .env.local (valores mascarados):"
          sed -E 's/=(.{6}).*/=\1.../' .env.local

      - name: Build
        run: npm run build
        continue-on-error: true

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Testes e2e (login, workspace, convite, troca, logout)
        run: npm run test:e2e
        continue-on-error: true

      - name: Teste de concorrência real (B2 — trava da sincronização de agenda)
        # pgTAP roda numa sessão só: prova a trava em sequência. Aqui, duas
        # sessões psql com transações abertas ao mesmo tempo provam que quem
        # aplica com a trava bloqueia a troca dela até terminar, e que quem a
        # perdeu espera e é recusado — ver scripts/b2-sync-lease-concurrency-check.sh.
        # Cria um workspace próprio; roda depois do e2e porque o passo
        # seguinte recria o banco local.
        run: bash scripts/b2-sync-lease-concurrency-check.sh

      - name: Teste de concorrência real (B3.2d-1 — claim da inbox do WhatsApp)
        # pgTAP roda numa sessão só: prova o claim em sequência. Aqui, oito
        # sessões psql pedem o claim da mesma entrada ao mesmo tempo (só uma
        # recebe), e transações abertas provam que o token vencido espera e
        # perde para quem reclamou e que o complete segura a linha — ver
        # scripts/b3-2d1-inbox-claim-concurrency-check.sh. Cria um canal
        # próprio; roda antes do passo que recria o banco local.
        run: bash scripts/b3-2d1-inbox-claim-concurrency-check.sh

      - name: Teste de concorrência real (B3.2d-2a — finalização sem efeito da inbox)
        # Dois consumidores pela mesma entrada (um claim só), duas
        # finalizações com o mesmo token (uma disposição só) e lease vencida
        # de verdade (o token original perde; só o novo finaliza) — ver
        # scripts/b3-2d2a-inbox-dispose-concurrency-check.sh. Canal próprio;
        # roda antes do passo que recria o banco local.
        run: bash scripts/b3-2d2a-inbox-dispose-concurrency-check.sh

      - name: Teste de concorrência real (B3.2d-2b1 — reserva do ledger de efeitos)
        # Duas reservas do mesmo evento (reserved e duplicate com o mesmo
        # id), uma reserva desfeita por falha depois dela (a outra reserva)
        # e o mesmo evento com outro efeito (conflict) — ver
        # scripts/b3-2d2b1-ledger-concurrency-check.sh. Canal próprio; roda
        # antes do passo que recria o banco local.
        run: bash scripts/b3-2d2b1-ledger-concurrency-check.sh

      - name: Teste de concorrência real (B3.2d-2b2a — efeito de mensagem recebida)
        # O mesmo evento duas vezes (applied e already_processed), o mesmo
        # remetente novo em dois eventos (uma identidade e uma conversa),
        # enriquecimento simultâneo telefone/BSUID e telefone e BSUID de
        # identidades diferentes (identity_conflict sem efeito) — ver
        # scripts/b3-2d2b2a-inbound-concurrency-check.sh. Canal próprio;
        # roda antes do passo que recria o banco local.
        run: bash scripts/b3-2d2b2a-inbound-concurrency-check.sh
        continue-on-error: true

      - name: Teste de concorrência real (B3.2d-2b2b1 — efeito de saída observada)
        # O mesmo evento duas vezes (applied e already_processed), echoes e
        # created da mesma mensagem (uma mensagem), o mesmo destinatário novo
        # em duas mensagens (uma identidade e uma conversa), o mesmo wamid
        # com ids diferentes (message_conflict sem efeito) e a pausa do
        # canal durante o efeito — ver
        # scripts/b3-2d2b2b1-outbound-concurrency-check.sh. Canal próprio;
        # roda antes do passo que recria o banco local.
        run: bash scripts/b3-2d2b2b1-outbound-concurrency-check.sh
        continue-on-error: true

      - name: Teste de concorrência real (B3.2d-2b2b2 — efeito de status e custo)
        # Dois status da mesma mensagem com a linha segurada (sem regressão),
        # failed tardio contra read nas duas ordens, custo final contra
        # estimativa tardia, o status esperando a saída observada da mesma
        # mensagem e a pausa do canal durante o efeito — ver
        # scripts/b3-2d2b2b2-status-concurrency-check.sh. Canal próprio;
        # roda antes do passo que recria o banco local.
        run: bash scripts/b3-2d2b2b2-status-concurrency-check.sh
        continue-on-error: true

      - name: Teste de concorrência real (B3.2d-2b2b3a — identidade alterada e troca de número)
        # Duas trocas da mesma identidade para o mesmo número, duas
        # identidades disputando um número e um BSUID, falha depois do
        # ledger, lease vencida durante a espera e a pausa do canal durante
        # o efeito — ver scripts/b3-2d2b2b3a-identity-concurrency-check.sh.
        # Canal próprio; roda antes do passo que recria o banco local.
        run: bash scripts/b3-2d2b2b3a-identity-concurrency-check.sh
        continue-on-error: true

      - name: Atualização a partir da versão anterior (numeração de propostas)
        # "Aplicar migrations do zero" já valida a criação do banco; este
        # passo valida a ATUALIZAÇÃO com dados emitidos pela versão anterior.
        # Recria o banco local, por isso roda depois do e2e.
        run: bash scripts/check-upgrade-proposal-counter.sh
        continue-on-error: true

      - name: Atualização a partir da versão anterior (B3.2d-2b1 — domínio do WhatsApp sobre a A7)
        # Usa a A7 na versão anterior (simulador, envio, status), aplica o
        # modelo do domínio e confere: leituras da A7 idênticas, nada criado
        # ou apagado, identidades e classificação sem inferência, backfill
        # idempotente — ver scripts/check-upgrade-b3-2d2b1-dominio.sh.
        # Recria o banco local, por isso roda no fim.
        run: bash scripts/check-upgrade-b3-2d2b1-dominio.sh
        continue-on-error: true

      - name: Atualização a partir da versão anterior (B3.2d-2b2a — efeito de mensagem recebida)
        # A7 e uma entrada da inbox gravadas antes da migration: leituras e
        # contagens idênticas depois; a entrada antiga aplica sobre a
        # conversa existente; o simulador e o envio seguem funcionando — ver
        # scripts/check-upgrade-b3-2d2b2a-efeito.sh. Recria o banco local,
        # por isso roda depois do e2e.
        run: bash scripts/check-upgrade-b3-2d2b2a-efeito.sh
        continue-on-error: true

      - name: Atualização a partir da versão anterior (B3.2d-2b2b1 — efeito de saída observada)
        # A7 e uma entrada de eco gravadas antes da migration: leituras e
        # contagens idênticas depois; o eco antigo aplica sobre a conversa
        # existente como outbound/business_app/internal, sem nada comercial;
        # o simulador e o envio seguem funcionando — ver
        # scripts/check-upgrade-b3-2d2b2b1-saida-observada.sh. Recria o
        # banco local, por isso roda depois do e2e.
        run: bash scripts/check-upgrade-b3-2d2b2b1-saida-observada.sh
        continue-on-error: true

      - name: Atualização a partir da versão anterior (B3.2d-2b2b2 — efeito de status e custo)
        # A7, uma saída observada, uma mensagem de API com custo estimado e
        # uma entrada de status gravadas antes da migration: leituras,
        # linhas e contagens idênticas depois; o status antigo aplica com o
        # custo final, sem nada comercial; o simulador, o envio e o status
        # da A7 seguem funcionando — ver
        # scripts/check-upgrade-b3-2d2b2b2-status-custo.sh. Recria o banco
        # local, por isso roda depois do e2e.
        run: bash scripts/check-upgrade-b3-2d2b2b2-status-custo.sh
        continue-on-error: true

      - name: Atualização a partir da versão anterior (B3.2d-2b2b3a — identidade alterada e troca de número)
        # A7, uma saída observada, um status e uma entrada de troca de
        # número gravados antes da migration: leituras, linhas e contagens
        # idênticas depois; a troca antiga aplica na mesma identidade, sem
        # nada comercial; a guarda das identidades continua; o simulador, o
        # envio e o status da A7 seguem funcionando — ver
        # scripts/check-upgrade-b3-2d2b2b3a-identidade.sh. Recria o banco
        # local, por isso roda por último.
        run: bash scripts/check-upgrade-b3-2d2b2b3a-identidade.sh
        continue-on-error: true

      - name: Publicar relatório do Playwright (só se algo falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Parar Supabase local
        if: always()
        run: supabase stop
