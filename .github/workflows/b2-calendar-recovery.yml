name: B2 — recuperação adicional da agenda (manual)

# Recuperação adicional do Google Agenda (docs/decisoes/b2-google-agenda.md
# §9.2, item 2): chama a manutenção da agenda e confere o batimento do
# agendador principal (Detector 1, §9.3).
#
# DESLIGADO POR PADRÃO, inclusive depois do merge:
#  - não há `schedule:` — o workflow só roda quando alguém o dispara à mão;
#  - não há endereço padrão — quem dispara informa o destino, e o script só
#    aceita os da lista aprovada (scripts/b2-calendar-recovery.ts), por
#    comparação exata; qualquer outro é recusado ANTES de qualquer requisição;
#  - usa segredos PRÓPRIOS da B2 (B2_CALENDAR_CRON_SECRET e
#    B2_CALENDAR_BYPASS_SECRET), que não existem até a validação os criar;
#    sem eles, nada é chamado. Não usa o bypass da A11.
# O bypass vai por cabeçalho, nunca na URL; redirecionamento não é seguido.
# Não substitui nem altera o workflow da A11.
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Destino aprovado (origem exata, sem barra no fim). Hoje, só o Preview da validacao-b2."
        required: true

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Chamar /api/cron/calendar (source=github)
        env:
          CRON_SECRET: ${{ secrets.B2_CALENDAR_CRON_SECRET }}
          BYPASS_SECRET: ${{ secrets.B2_CALENDAR_BYPASS_SECRET }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
        # Rodada que falhou volta 503 (com as contagens): o job fica vermelho
        # e o corpo aparece no log.
        run: node scripts/b2-calendar-recovery.ts
