name: A11 — reconciliação de outbox e retenção

# GitHub só avalia `schedule:` a partir do branch padrão (main). Enquanto
# este arquivo viver só em feat/a11-forms-attribution, o disparo
# automático NÃO ocorre — é preciso mergear para main para o agendamento
# valer de fato. Até lá, use `workflow_dispatch` (manual) ou a estratégia
# de teste descrita em A11-HANDOFF.md para provar o comportamento antes
# do merge.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL base do deployment (produção ou preview)"
        required: true
        default: "https://praxis-crm.vercel.app"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/outbox
        env:
          CRON_SECRET: ${{ secrets.A11_CRON_SECRET }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://praxis-crm.vercel.app' }}
        run: |
          curl -sf -X POST "${TARGET_URL}/api/cron/outbox?x-vercel-protection-bypass=${BYPASS_SECRET}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            -w "\nHTTP %{http_code}\n"

      - name: Chamar /api/cron/retention
        env:
          CRON_SECRET: ${{ secrets.A11_CRON_SECRET }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://praxis-crm.vercel.app' }}
        run: |
          curl -sf -X POST "${TARGET_URL}/api/cron/retention?x-vercel-protection-bypass=${BYPASS_SECRET}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            -w "\nHTTP %{http_code}\n"
