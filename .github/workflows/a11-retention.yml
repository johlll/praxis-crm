name: A11 — retenção (somente manual)

# SEM `schedule:` de propósito, e isso é a parte importante deste arquivo.
#
# `/api/cron/retention` executa três funções, e duas delas escrevem em
# linhas que hoje são evidência preservada:
#
#   1. `flag_stuck_webhook_events` marca `stuck_alerted_at` e grava alerta
#      + auditoria para todo evento com `processed_at is null` cujo
#      `stuck_after` já venceu e cujo status não seja
#      `processed`/`expired_unprocessed`/`purged`. O evento histórico
#      `dead` (artefato de teste com ciphertext inválido) se encaixa nesse
#      filtro e seria sinalizado como "travado" — sem ser pendência
#      recuperável nenhuma.
#   2. `purge_expired_webhook_events` anula `payload_ciphertext`,
#      `payload_iv`, `payload_auth_tag`, `payload_algorithm`,
#      `payload_key_version`, `payload_sanitized` e `occurred_at` de toda
#      linha com `expires_at <= now()`. Com retenção de 30 dias e eventos
#      recebidos entre 21 e 28/09/2026, isso começa a valer por volta de
#      21/10/2026 — e, num schedule, aconteceria sozinho, sem ninguém
#      pedir, apagando as evidências de QA da A11.
#
# Agendar a retenção é decisão explícita do responsável, com o destino dos
# payloads históricos resolvido antes. Enquanto não houver essa decisão,
# este workflow roda só por acionamento manual.
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL base do deployment (produção ou preview)"
        required: true
        default: "https://praxis-crm-eight.vercel.app"

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/retention
        env:
          CRON_SECRET: ${{ secrets.A11_CRON_SECRET }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://praxis-crm-eight.vercel.app' }}
        run: |
          curl -sf -X POST "${TARGET_URL}/api/cron/retention?x-vercel-protection-bypass=${BYPASS_SECRET}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            -w "\nHTTP %{http_code}\n"
