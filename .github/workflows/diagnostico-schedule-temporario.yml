name: diagnostico-schedule-temporario

# TEMPORÁRIO — deve ser removido por PR depois de cumprir a finalidade.
#
# Finalidade: observar se o evento `schedule` é entregue a este
# repositório. Fatos verificados que motivam o experimento: o repositório
# nunca teve nenhuma execução por `schedule` (zero runs, para qualquer
# workflow, em toda a sua história), e o `a11-reconcile.yml` não disparou
# automaticamente desde que entrou em `main`, embora esteja `active`, com
# o arquivo no branch padrão, cron e indentação válidos, ator vinculado à
# conta dona do repositório e sem incidente oficial de Actions no período
# — período em que o Actions esteve comprovadamente funcional para este
# repositório (execuções por `push`, `pull_request` e `workflow_dispatch`
# passaram normalmente).
#
# COMO LER O RESULTADO — e como NÃO ler:
#
#   - Se ESTE workflow executar por `schedule`, fica comprovado apenas
#     que o `schedule` é entregue PARA ELE. Isso **não identifica, por si
#     só, a causa** da ausência de execução do `a11-reconcile.yml`: este
#     arquivo difere do original em várias dimensões ao mesmo tempo
#     (minutos do cron, conteúdo do job, uso de secrets, nome), então um
#     resultado positivo não isola nenhuma variável.
#
#   - Se NÃO executar em 30–45 minutos, o resultado é **inconclusivo**,
#     não negativo: a documentação oficial admite que execuções agendadas
#     sejam atrasadas ou descartadas sob carga, sem prazo garantido.
#
#   - Nenhuma causa deve ser atribuída a característica do arquivo (por
#     exemplo, caracteres não-ASCII no `name`) sem evidência que a
#     sustente. Até aqui não existe essa evidência.
#
# Segurança: não usa secrets, não faz chamada externa, não toca Production
# e não escreve em nada. O job só imprime uma linha.
on:
  schedule:
    # Minutos deslocados do topo do intervalo, que é a faixa que a
    # documentação oficial aponta como a mais sujeita a atraso.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar a execução
        run: |
          echo "diagnostico de schedule — evento=${{ github.event_name }}"
          date -u +"instante=%Y-%m-%dT%H:%M:%SZ"
