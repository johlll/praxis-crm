# =====================================================================================================
# MODELO — NÃO É UM WORKFLOW DESTE REPOSITÓRIO.
#
# Este arquivo mora em `docs/backup/modelo-repositorio-privado/` do repositório PÚBLICO do Praxis
# justamente para NÃO rodar aqui (o GitHub só executa o que está em `.github/workflows/` na raiz).
# Ele será copiado, DEPOIS DE APROVADO, para um repositório GitHub PRIVADO e SEPARADO, só de backups:
#
#   1. criar o repositório privado de backups (nunca público);
#   2. copiar para ele este arquivo em `.github/workflows/backup-diario.yml` e a pasta
#      `scripts/backup/` (lib.sh, backup-db.sh, restore-db.sh, restore-*.sql e, para o Storage,
#      lib-storage.sh, backup-storage.sh e restore-storage.sh);
#   3. configurar os secrets do repositório privado (nunca no público):
#        BACKUP_DATABASE_URL    URL da conexão do banco (modo "Session pooler", porta 5432, com SSL)
#        BACKUP_AGE_PUBLIC_KEY  chave PÚBLICA age (age1...). A chave PRIVADA fica só com João,
#                               fora do GitHub, e nunca é cadastrada em lugar nenhum;
#      e, SÓ quando o backup do Storage for ativado (C5a.1), os quatro da chave S3 DEDICADA ao backup
#      (um único par, criado só para isto e revogável; dá acesso total ao Storage, por isso só aqui):
#        BACKUP_STORAGE_S3_ENDPOINT, BACKUP_STORAGE_S3_REGION,
#        BACKUP_STORAGE_S3_ACCESS_KEY_ID, BACKUP_STORAGE_S3_SECRET_ACCESS_KEY;
#   4. rodar uma vez por "Run workflow" (workflow_dispatch) e conferir o artefato;
#   5. só depois deixar o agendamento valer.
#
# O workflow tem guardas: não roda no repositório público do Praxis, nem em qualquer repositório que
# não seja privado, e não responde a pull_request.
#
# AGENDAMENTO RESISTENTE A ATRASO: o agendamento do GitHub é de melhor esforço (uma janela de 07:30 já rodou quase
# sete horas depois, e o GitHub pode descartar uma execução sem avisar). Por isso há QUATRO oportunidades por
# dia, mas no máximo UM backup completo a cada 20 horas: o job `janela` roda primeiro e consulta SÓ os metadados
# dos artefatos deste próprio repositório (token efêmero, somente leitura). Se já existe um backup completo e
# bem-sucedido com menos de 20 horas, ele encerra com sucesso e o job `backup` NÃO roda — sem instalar nada e sem
# tocar em banco, Storage ou secrets. Sem backup recente, o backup roda normalmente. O disparo manual
# (workflow_dispatch) ignora a trava e SEMPRE executa. Se a consulta ao GitHub falhar, a janela falha fechada
# (nunca presume que há backup recente). O objetivo continua sendo um RPO de aproximadamente 24 horas.
# =====================================================================================================
name: Backup diário do Praxis (modelo)

on:
  schedule:
    # Quatro oportunidades diárias, todas depois do lote diário de retenção da C3b (06:17 UTC).
    # 07:30 UTC = 04:30 em Brasília; 11:30, 15:30 e 19:30 UTC são as janelas de reserva.
    - cron: "30 7 * * *"
    - cron: "30 11 * * *"
    - cron: "30 15 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:

# Uma execução por vez; uma nova NÃO cancela a que está rodando.
concurrency:
  group: praxis-backup
  cancel-in-progress: false

# Nenhuma permissão de escrita: o artefato é enviado pelo próprio runner, sem token de escrita.
permissions:
  contents: read

jobs:
  janela:
    # Decide se já existe um backup completo recente. Nunca no repositório público do Praxis. Não tem secrets,
    # não instala nada e só LÊ metadados dos artefatos deste repositório (a leitura de Actions é a única
    # permissão a mais, e só neste job).
    if: ${{ github.repository != 'johlll/praxis-crm' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    outputs:
      executar: ${{ steps.decidir.outputs.executar }}
    steps:
      - name: Exigir repositório PRIVADO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')" = "true"

      - name: Decidir se já existe um backup completo recente (só metadados dos artefatos)
        id: decidir
        env:
          GH_TOKEN: ${{ github.token }}
          LIMITE_HORAS: "20"
        run: |
          set -euo pipefail

          saida() { printf 'executar=%s\n' "$1" >>"$GITHUB_OUTPUT"; }
          falhar() { printf 'ERRO: %s\n' "$1" >&2; exit 1; }

          # Disparo manual: SEMPRE executa, sem a trava de 20 horas e sem consultar nada.
          # Execução agendada: só executa se não houver backup completo recente. Qualquer outro evento é inesperado.
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              echo "janela: disparo_manual -> executar"
              saida true
              exit 0
              ;;
            schedule) ;;
            *) falhar evento_inesperado ;;
          esac

          limite=$((LIMITE_HORAS * 3600))
          agora="$(date -u +%s)"
          # Caminho DESTE workflow neste repositório: só contam execuções dele.
          meu_caminho="${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}"
          meu_caminho="${meu_caminho%%@*}"

          # 1. Só METADADOS dos artefatos do próprio repositório (nunca o conteúdo): idade em segundos e a execução
          #    que o gerou, do mais novo para o mais antigo. Conta só artefato não expirado, não vazio, com o nome
          #    do backup e ligado à execução que o nome indica. Qualquer falha de consulta falha fechado.
          candidatos="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" 2>/dev/null \
            | jq -r --argjson agora "$agora" '
                .artifacts[]
                | select(.expired == false and .size_in_bytes > 0 and (.name | test("^praxis-backup-[0-9]+$")))
                | select((.name | sub("^praxis-backup-"; "")) == (.workflow_run.id | tostring))
                | [([($agora - (.created_at | fromdateiso8601)), 0] | max), (.workflow_run.id | tostring)]
                | @tsv' 2>/dev/null \
            | tr -d '\r' | sort -n)" || falhar estado_anterior_indisponivel

          while IFS=$'\t' read -r idade execucao; do
            [ -n "${execucao}" ] || continue
            [[ "${idade}" =~ ^[0-9]+$ && "${execucao}" =~ ^[0-9]+$ ]] || falhar estado_anterior_indisponivel
            [ "${idade}" -lt "${limite}" ] || continue
            # 2. Só conta se a execução que gerou o artefato terminou com SUCESSO, neste mesmo workflow.
            situacao="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${execucao}" 2>/dev/null \
              | jq -r '[.status, .conclusion, ((.path // "") | sub("@.*$"; ""))] | @tsv' 2>/dev/null \
              | tr -d '\r')" || falhar estado_anterior_indisponivel
            if [ "${situacao}" = "$(printf 'completed\tsuccess\t%s' "${meu_caminho}")" ]; then
              echo "janela: backup_recente idade_horas=$((idade / 3600)) limite_horas=${LIMITE_HORAS} -> nao_executar"
              saida false
              exit 0
            fi
          done <<<"${candidatos}"

          echo "janela: sem_backup_recente limite_horas=${LIMITE_HORAS} -> executar"
          saida true

  backup:
    needs: janela
    # Só roda se a janela mandar executar (nenhum backup completo com menos de 20 horas) ou em disparo manual.
    # Nunca no repositório público do Praxis (o segundo guarda, "privado", está no primeiro passo).
    if: ${{ github.repository != 'johlll/praxis-crm' && needs.janela.outputs.executar == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Exigir repositório PRIVADO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')" = "true"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Instalar o cliente PostgreSQL 17 (fixado)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -q " 17\."

      - name: Instalar o age (versão e SHA-256 fixados)
        env:
          AGE_VERSION: "1.3.2"
          AGE_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  ${RUNNER_TEMP}/age.tar.gz" | sha256sum --check --status
          sudo tar -xzf "$RUNNER_TEMP/age.tar.gz" -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          rm -f "$RUNNER_TEMP/age.tar.gz"
          age --version

      - name: Gerar o backup criptografado
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          BACKUP_OUTPUT_DIR: backup-out
        run: bash scripts/backup/backup-db.sh

      - name: Conferir a saída (só o pacote criptografado e o checksum)
        run: |
          set -euo pipefail
          cd backup-out
          test "$(ls -1 | wc -l)" -eq 2
          test "$(ls -1 ./*.tar.gz.age | wc -l)" -eq 1
          test "$(ls -1 ./*.tar.gz.age.sha256 | wc -l)" -eq 1
          sha256sum --check --status ./*.tar.gz.age.sha256

      - name: Conferir as ferramentas do backup do Storage (aws e jq)
        run: |
          set -euo pipefail
          aws --version
          jq --version

      - name: Gerar o backup criptografado do Storage (bucket proposal-documents, só leitura)
        env:
          BACKUP_STORAGE_S3_ENDPOINT: ${{ secrets.BACKUP_STORAGE_S3_ENDPOINT }}
          BACKUP_STORAGE_S3_REGION: ${{ secrets.BACKUP_STORAGE_S3_REGION }}
          BACKUP_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_S3_ACCESS_KEY_ID }}
          BACKUP_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_S3_SECRET_ACCESS_KEY }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          BACKUP_OUTPUT_DIR: storage-out
        run: bash scripts/backup/backup-storage.sh

      - name: Conferir a saída do Storage (só o pacote criptografado e o checksum)
        run: |
          set -euo pipefail
          cd storage-out
          test "$(ls -1 | wc -l)" -eq 2
          test "$(ls -1 ./*.tar.gz.age | wc -l)" -eq 1
          test "$(ls -1 ./*.tar.gz.age.sha256 | wc -l)" -eq 1
          sha256sum --check --status ./*.tar.gz.age.sha256

      - name: Enviar os pacotes criptografados (retenção de 30 dias)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: praxis-backup-${{ github.run_id }}
          path: |
            backup-out/*.tar.gz.age
            backup-out/*.tar.gz.age.sha256
            storage-out/*.tar.gz.age
            storage-out/*.tar.gz.age.sha256
          retention-days: 30
          if-no-files-found: error
